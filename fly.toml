# Laminar Fly.io 앱 설정 (Task 1.8)
# 사용: fly deploy [--app laminar-prod]
# 시크릿: fly secrets list -a laminar-prod (17 staged — Task 0.7)

app = "laminar-prod"
primary_region = "nrt"  # Tokyo — Neon ap-southeast-1과 가장 가까움 (~50ms)

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  TZ = "UTC"  # 컨테이너 시간대 (애플리케이션 내부도 UTC 고정)

[http_service]
  internal_port = 8080
  force_https = true
  # 비용 절감: 유휴 시 suspend(RAM 스냅샷→빠른 재개), 요청 시 자동 기동. min 0.
  # ⚠️ suspend 중에는 @Scheduled 크론(cleanup/rrule/outbox/email)이 돌지 않음 — 현재
  #    반복카드·임포트·메일 미사용이라 무방. 정기 크론이 필수가 되면 always-on으로 되돌릴 것.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    # JVM cold start가 길어 health check 플래핑 → 재시작 루프를 막기 위해 grace 확대.
    grace_period = "120s"
    method = "GET"
    path = "/actuator/health"

# performance-1x(전용 CPU) + 2GB — shared-cpu-1x/512MB에서 부팅 89초·요청 타임아웃 발생하여 상향.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
  cpu_kind = "performance"
  cpus = 1

[deploy]
  strategy = "immediate"  # 단일 인스턴스라 rolling 의미 없음
  # release_command = "..."  # Phase 9 cron prep 시 (예: warmup, schema validation)

# Phase 6 백업 cron(pg_dump)은 R2로 직접 업로드 → 로컬 mount 불필요
# [mounts]는 Phase 12 운영 시 백업 임시 파일 처리 방식 결정 후 추가 검토
