# Laminar Fly.io 앱 설정 (Task 1.8)
# 사용: fly deploy [--app laminar-prod]
# 시크릿: fly secrets list -a laminar-prod (17 staged — Task 0.7)

app = "laminar-prod"
primary_region = "nrt"  # Tokyo — Neon ap-southeast-1과 가장 가까움 (~50ms)

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  TZ = "UTC"  # 컨테이너 시간대 (애플리케이션 내부도 UTC 고정)

[http_service]
  internal_port = 8080
  force_https = true
  # cron job(@Scheduled)이 동작해야 하므로 머신을 항상 가동 (idle 시 stop 금지)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "immediate"  # 단일 인스턴스라 rolling 의미 없음
  # release_command = "..."  # Phase 9 cron prep 시 (예: warmup, schema validation)

# Phase 6 백업 cron(pg_dump)은 R2로 직접 업로드 → 로컬 mount 불필요
# [mounts]는 Phase 12 운영 시 백업 임시 파일 처리 방식 결정 후 추가 검토
