# Laminar API — 공통 설정 (Task 1.3.1)
# 프로파일별 오버라이드: application-local.yml / application-prod.yml
spring:
  application:
    name: api
  mvc:
    pathmatch:
      # SpaForwardController의 정규식 + ** 패턴이 Spring Boot 3의 PathPattern과
      # 호환 안 됨 → legacy AntPathMatcher 사용. Phase 5에서 SPA fallback을
      # PathPattern 호환 방식(필터·view controller)으로 재설계 시 제거.
      matching-strategy: ant_path_matcher
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마 변경은 Flyway 단독 책임
    open-in-view: false   # OSIV anti-pattern 비활성
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080
  forward-headers-strategy: native  # Fly proxy의 X-Forwarded-* 신뢰

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# JWT 인증 — access 토큰 HS256 서명. secret은 환경변수(JWT_SECRET) 주입, 평문 커밋 금지.
# refresh 토큰은 opaque(sessions 테이블 해시)라 secret 불필요. TTL은 ISO-8601 Duration.
app:
  jwt:
    secret: ${JWT_SECRET:}
    # access TTL = access 쿠키 Max-Age. 짧으면(15m) 그 주기마다 첫 요청이 401→refresh를
    # 반응적으로 타 401이 자주 노출됨 → 한 세션을 덮도록 8h로 상향(refresh 28d는 유지).
    access-ttl: PT8H
    refresh-ttl: P28D
  # 메일(비밀번호 재설정). RESEND_API_KEY 미설정 시 발송 생략 + 링크를 서버 로그로 남김(오너 폴백).
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
    resend-api-key: ${RESEND_API_KEY:}
    reset-base-url: ${APP_BASE_URL:https://laminar-prod.fly.dev}
