# Testcontainers 통합 테스트 프로파일.
# DataSource는 @ServiceConnection이 PostgreSQLContainer로부터 자동 주입.
# Flyway는 V1~V12 마이그레이션을 컨테이너에 자동 적용.

spring:
  datasource:
    hikari:
      # 백그라운드 워커(outbox 30s·메일 60s 폴링) + audit REQUIRES_NEW + 테스트 트랜잭션 동시 수요 여유.
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.test: INFO

app:
  cookie:
    secure: false
  jwt:
    # 테스트 전용 더미(HS256 최소 32바이트 충족) — 실 배포 secret은 환경변수 JWT_SECRET.
    secret: "integration-test-only-jwt-secret-0123456789abcdef"
  r2:
    # 부팅용 더미 — presign은 로컬 서명 연산이라 네트워크 불필요, endpoint는 placeholder 기본값 사용.
    access-key: "integration-test-access-key"
    secret-key: "integration-test-secret-key"
