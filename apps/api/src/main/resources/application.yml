# Laminar API — 공통 설정 (Task 1.3.1)
# 프로파일별 오버라이드: application-local.yml / application-prod.yml
spring:
  application:
    name: api
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마 변경은 Flyway 단독 책임
    open-in-view: false   # OSIV anti-pattern 비활성
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080
  forward-headers-strategy: native  # Fly proxy의 X-Forwarded-* 신뢰

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
