# Laminar API — prod 프로파일 (Task 1.3.3)
# 활성화: SPRING_PROFILES_ACTIVE=prod (Fly.io env)
spring:
  datasource:
    url: ${DATABASE_URL}  # Neon pooler
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: laminar-main-prod
      data-source-properties:
        prepareThreshold: 0  # Neon pooler 호환 — Postgres prepared statement 비활성
  jpa:
    show-sql: false
  # Google OAuth2 로그인 (Spring Security) — Fly secret AUTH_GOOGLE_ID/SECRET 사용.
  # prod 프로파일에만 등록 → local/test는 미등록이라 oauth2Login이 conditional로 skip(부팅 안전).
  # redirect-uri 기본값: https://laminar-prod.fly.dev/login/oauth2/code/google
  #   → Google Cloud Console의 OAuth 클라이언트 '승인된 리디렉션 URI'에 등록 필요(인프라 작업).
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${AUTH_GOOGLE_ID}
            client-secret: ${AUTH_GOOGLE_SECRET}
            scope:
              - openid
              - email
              - profile

# Cron 전용 DataSource (Task 1.3.4) — direct 엔드포인트, 풀 크기 3
app:
  datasource:
    cron:
      url: ${DATABASE_URL_DIRECT}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        pool-name: laminar-cron-prod
  # Cloudflare R2 (S3 호환) — Fly secret R2_* env var를 R2Config @Value 키로 매핑
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:laminar-attachments}
  cookie:
    secure: true

logging:
  level:
    com.laminar: INFO
    org.springframework.security: WARN
