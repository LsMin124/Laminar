# Spring Boot 3.5 플러그인은 Gradle 데몬 launch JVM이 17+ 필요.
#
# Java 21 launch JVM 지정 방법 (택1):
#   1) 시스템 java가 21+ → 추가 설정 불필요
#   2) JAVA_HOME=/path/to/jdk21 export → Gradle이 자동 인식
#   3) ~/.gradle/gradle.properties (사용자-전역, gitignore 자동)에 다음 추가:
#        org.gradle.java.home=/path/to/jdk21
#   4) 본 파일에 직접 핀 (machine-specific, commit 시 portability 깨짐 — 비추천)
#
# CI: actions/setup-java가 JAVA_HOME 설정 → Gradle 자동 사용.
# 본 프로젝트 파일은 비어 두어 다양한 dev 환경 호환.
